apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: backend-replicaset
  namespace: grade-tracker
  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-rs
  template:
    metadata:
      labels:
        app: backend-rs
    spec:
      containers:
      - name: backend
        image: kenanricky/grade-tracker-frontend:v1.0.0
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
           name: grade-tracker-config
     
