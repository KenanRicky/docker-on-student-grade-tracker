apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: grade-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 postgres-service 5432; do echo waiting for database; sleep 2; done']
      containers:
      - name: backend
        image: kenanricky/grade-tracker-backend:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: grade-tracker-config
        env:
        - name: DB_PASSWORD
          value: "password"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
